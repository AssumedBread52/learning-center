# The Compose file both worktrees share (ADR-4). Every image version is
# an anchor in x-images, committed here so a bump reaches every clone.
# Until the application has services, the one service is the node
# utility under the tools profile, which up ignores and run uses. The
# user comes from the git-ignored .env that scripts/up.sh writes. The
# volume covers /home/node whole because Docker gives a fresh volume the
# ownership of the image directory it covers, and /home/node belongs to
# uid 1000 in the node image, while a path absent from the image comes up
# owned by root.
x-images:
  node: &node-image node:24.21.0

services:
  node:
    profiles: ["tools"]
    image: *node-image
    user: "${USER_ID:?run scripts/up.sh}:${GROUP_ID:?run scripts/up.sh}"
    working_dir: /app
    entrypoint: node
    environment:
      HOME: /home/node
      NPM_CONFIG_CACHE: /home/node/.npm
    volumes:
      - .:/app
      - node-home:/home/node

volumes:
  node-home:
